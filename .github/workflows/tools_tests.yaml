name: Python tools (strainkit)

on:
  push:
    branches:
      - develop
      - 2.0dev
  pull_request:
    branches:
      - develop
      - 2.0dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: strainkit tests (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ['3.11']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: alamode
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          conda env update -n alamode -f etc/alamode-environment.yml
          conda install -y -c conda-forge ase pytest nanobind scikit-build-core lxml
      - name: Build and install the alm Python package
        run: |
          pip install ./python --no-build-isolation -v
          python -c "import alm; print(alm.__version__)"
      - name: Build the alm CLI
        # tests/test_alm_api.py compares the Python API with _build/alm/alm and
        # is skipped (which fails the job below) when the binary is missing.
        run: |
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make alm -j4
      - name: Run the strainkit tests
        working-directory: ./tools
        run: |
          # the suite must actually run: fail if any (ALM/ase dependent) test was skipped
          python -m pytest tests -v -rs 2>&1 | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "some tests were skipped"; exit 1; fi
