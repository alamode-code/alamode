name: Sanitizer build (ASan/UBSan)

# Builds ALM/ANPHON with AddressSanitizer + UndefinedBehaviorSanitizer and runs
# the small Si example. This catches out-of-bounds accesses, use-after-free and
# undefined behaviour that ordinary Release builds silently ignore.
#
# Notes:
#  * detect_leaks=0 — the code intentionally relies on process exit to release
#    memory, so leak detection is disabled to avoid noise. Heap-overflow and
#    use-after-free detection (the valuable part of ASan) stays on.
#  * If third-party libraries (Eigen/Boost/HDF5) produce false positives, add a
#    suppressions file via ASAN_OPTIONS/UBSAN_OPTIONS rather than disabling here.

on:
  workflow_dispatch:
  push:
    branches:
      - 2.0dev

jobs:
  sanitize:
    runs-on: ubuntu-latest
    name: ASan/UBSan build + Si test
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: alamode
          python-version: '3.10'

      - name: Update environment
        run: conda env update -n alamode -f etc/alamode-environment.yml

      - name: Build alm and anphon with sanitizers
        run: |
          # Build into _build because test/test_si.py looks for the binaries at
          # _build/alm/alm and _build/anphon/anphon (the path is hardcoded there).
          mkdir -p _build
          cd _build
          # UBSan is left in recoverable (report-only) mode — the codebase has not
          # been UBSan-audited yet, so halting on the first hit would abort every run
          # before it produces output. ASan stays fatal (memory corruption is the
          # high-value, low-false-positive signal). Once the UBSan reports are
          # triaged, add -fno-sanitize-recover=undefined to make UB fatal too.
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                ..
          # Limit parallelism: each cc1plus uses several GB under ASan+UBSan, so an
          # unbounded "make -j" launches ~30 compiles of the large translation units
          # at once and the runner is OOM-killed. -j2 keeps peak memory in check.
          make -j2 alm anphon
          cd ..

      - name: Run test Si under sanitizers
        working-directory: ./test
        env:
          # ASan halts on memory errors; UBSan reports and continues (halt_on_error=0)
          # so the run completes and produces output for the consistency check.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: python test_si.py

      # On failure, re-run the two anphon modes directly (the inputs and FCS file
      # were generated under test/si by test_si.py) with stderr captured, so the
      # exact AddressSanitizer/UBSan report and the failing mode are visible in
      # the log instead of just a downstream "failed to execute" message.
      - name: Show sanitizer report on failure
        if: failure()
        working-directory: ./test/si
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          echo "=== output files present ==="; ls -la
          echo "=== anphon phband.in (phonons) ==="
          ../../_build/anphon/anphon phband.in 2>&1 | tail -80 || true
          echo "=== anphon RTA.in (RTA) ==="
          ../../_build/anphon/anphon RTA.in 2>&1 | tail -80 || true
