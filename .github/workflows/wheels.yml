name: Wheels

# Three platforms and four Python versions with the full tool tests: run only when the Python
# package or the C++ sources change, for a release, or by hand.
on:
  pull_request:
    paths:
      - 'python/**'
      - 'alm/**'
      - 'anphon/**'
      - 'include/**'
      - 'external/**'
      - '.github/workflows/wheels.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: 'Upload the wheels to test.pypi.org'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    # GitHub-hosted runners only, so not on the private alamode-developer repository
    if: github.repository != 'alamode-code/alamode-developer'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Upload to PyPI
    if: >-
      github.repository == 'alamode-code/alamode' && github.event_name == 'release'
      && !github.event.release.prerelease
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Upload to TestPyPI
    if: >-
      github.repository == 'alamode-code/alamode' && github.event_name == 'workflow_dispatch'
      && inputs.testpypi
    needs: wheels
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
