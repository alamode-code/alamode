name: Run ZnO example

on:
  push:
    branches:
      - develop
      - 2.0dev
    # paths:
    #   - '**.cpp'
    #   - '**.h'
    #   - '**.py'
    #   - '**.c'
  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
#        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ['3.10']
    name: OS ${{ matrix.os }} Python ${{ matrix.python-version }} 
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev \
            gcc \
            g++ \
            libopenmpi-dev \
            liblapack-dev \
            libblas-dev \
            libfftw3-dev \
            cmake \
            libeigen3-dev \
            python3 \
            python3-pip

      - name: Install Python libraries
        run: |
          pip3 install numpy
      
      - name: Checkout spglib
        uses: actions/checkout@v4
        with:
          repository: atztogo/spglib
          path: spglib_repo
          ref: v2.4.0

      - run: echo ${CC} ${CXX}

      - name: Build spglib
        run: |
          mkdir spglib
          cd spglib_repo
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../../spglib ..
          make -j
          make install
          cd ../../

      - name: Build alm and anphon with cmake
        run: |
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release -DSPGLIB_ROOT=../spglib/ ..
          make -j
          cd ..
      
      - name: Run test ZnO
        working-directory: ./test
        run: |
          export LD_LIBRARY_PATH=../spglib/lib:${LD_LIBRARY_PATH}
          python test_zno.py
