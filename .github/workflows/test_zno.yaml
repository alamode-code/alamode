name: Test Si example

on:
  push:
    branches:
      - develop
      - 2.0dev
    # paths:
    #   - '**.cpp'
    #   - '**.h'
    #   - '**.py'
    #   - '**.c'
  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
#        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ['3.10']
    name: OS ${{ matrix.os }} Python ${{ matrix.python-version }} 
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev \
            gcc \
            g++ \
            libopenmpi-dev \
            liblapack-dev \
            libblas-dev \
            libfftw3-dev \
            cmake \
            libspglib-dev \
            libeigen3-dev \
            python3 \
            python3-pip

      - name: Install Python libraries
        run: |
          pip3 install numpy

      - run: echo ${CC} ${CXX}

      - name: Build alm and anphon with cmake
        run: |
          mkdir -p _build
          cd _build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j
          cd ..
      
      - name: Run test ZnO
        working-directory: ./test
        run: python test_zno.py
