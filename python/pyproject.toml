[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "alm"
version = "2.0.dev0"
description = "Python interface (nanobind) to the ALAMODE 2.0dev ALM library"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.version = ">=3.17"
cmake.source-dir = "."
wheel.packages = ["alm"]
# Build type; Release for optimized fits.
cmake.build-type = "Release"

# Dependency locations are passed at install time, e.g.:
#   pip install . \
#     -C cmake.define.SPGLIB_ROOT=/Users/tadano/spglib \
#     -C cmake.define.EIGEN3_INCLUDE=/opt/homebrew/include/eigen3 \
#     -C cmake.define.BOOST_INCLUDE=/opt/homebrew/include \
#     -C cmake.define.USE_ACCEL_BACKEND=ON
# (HDF5 is auto-detected via find_package; pass -C cmake.define.HDF5_ROOT=... if needed.)
